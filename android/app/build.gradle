def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

def releaseKeystorePath = localProperties.getProperty('maumaps.releaseStoreFile') ?: System.getenv('MAUMAPS_ANDROID_KEYSTORE')
def releaseKeystorePassword = localProperties.getProperty('maumaps.releaseStorePassword') ?: System.getenv('MAUMAPS_ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = localProperties.getProperty('maumaps.releaseKeyAlias') ?: System.getenv('MAUMAPS_ANDROID_KEY_ALIAS')
def releaseKeyPassword = localProperties.getProperty('maumaps.releaseKeyPassword') ?: System.getenv('MAUMAPS_ANDROID_KEY_PASSWORD')
def hasReleaseSigning = releaseKeystorePath && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword
def allowDebugReleaseSigning = (System.getenv('MAUMAPS_ALLOW_DEBUG_RELEASE_SIGNING') ?: 'false').toBoolean()

android {
    namespace "maps.maumaps.live_sensors"
    compileSdkVersion flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "maps.maumaps.live_sensors"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion 19
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else if (allowDebugReleaseSigning) {
                signingConfig signingConfigs.debug
            } else {
                throw new GradleException("Release signing is not configured. Provide Maumaps signing properties or set MAUMAPS_ALLOW_DEBUG_RELEASE_SIGNING=true for a non-production build.")
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.work:work-runtime-ktx:2.8.1'
}
